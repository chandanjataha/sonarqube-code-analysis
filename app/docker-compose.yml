# ================================================================
# docker-compose.yml — Local container testing
# Usage:  docker compose up --build
# ================================================================

version: "3.9"

services:
  table-learning-app:
    image: table-learning-app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production          # use the final nginx stage
    container_name: tablemaster
    ports:
      - "3000:80"                 # http://localhost:3000
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
