apiVersion: apps/v1
kind: Deployment

metadata:
  name: tablemaster
  namespace: ns-arav

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tablemaster

  template:
    metadata:
      labels:
        app: tablemaster

    spec:
      containers:
        - name: tablemaster

          image: robodevelopacr.azurecr.io/tablemaster:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5