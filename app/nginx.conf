# ================================================================
# nginx.conf — Custom config for React SPA (Vite build)
# Handles: client-side routing, gzip, caching, security headers
# ================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Document root — matches COPY destination in Dockerfile
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip Compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin"         always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
        always;

    # ── Static Asset Caching ─────────────────────────────────────
    # Vite fingerprints JS/CSS filenames → safe to cache forever
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA Fallback — CRITICAL for React Router ─────────────────
    # Any path that isn't a real file → serve index.html
    # This enables client-side navigation (Home / Learn / Quiz / Dashboard)
    location / {
        try_files $uri $uri/ /index.html;

        # HTML itself should not be cached (so new deploys load immediately)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Health-check endpoint (used by K8s / ALB / ECS) ──────────
    location /health {
        access_log  off;
        return 200  "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── Hide Nginx version in error pages ────────────────────────
    server_tokens off;

    # ── Custom error pages ────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
